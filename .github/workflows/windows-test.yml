name: Windows Tests

on:
  pull_request:
    paths:
      - ".github/workflows/windows-test.yml"
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "index.html"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-test.yml"
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "index.html"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - name: Typecheck and production build
        run: npm run build

  rust:
    name: Rust tests on Windows
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -- --test-threads=1

      - name: Build Rust backend
        working-directory: src-tauri
        run: cargo build
